[project]
name = "orchestrator"
version = "0.1.0"
description = "LLM Verification Service for Security Audit Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "tenacity>=8.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true